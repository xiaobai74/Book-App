# 小说管理App API 反向代理
# __DOMAIN__ 由 deploy.sh 替换为实际域名或公网 IP
server {
    listen 80;
    server_name __DOMAIN__;

    # Web 前端静态文件（上传了 frontend/dist 时自动生效）
    root /opt/novel-backend/frontend-dist;
    index index.html;

    # API 反向代理到后端 uvicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── SSE 流式友好配置（边爬边看 v2.6：/books/{id}/crawl-stream） ──
        # 关闭缓冲/缓存，改用 HTTP/1.1 长连接，避免 nginx 把事件流攒批后一次性下发；
        # 读超时放宽到 1 小时，兼容长时抓取流与本地导入（前端上传超时 120s）。
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 健康检查直接透传
    location = /health {
        proxy_pass http://127.0.0.1:8000;
    }

    # 深链刷新兼容：前端 base './'（兼容 Electron/Capacitor），
    # 直接刷新 history 路由（如 /detail/{id}）时相对资源路径会变成 /detail/assets/...，
    # 统一重写到 /assets/...，避免 fallback 到 index.html 引发 module MIME 错误。
    # 移动端 APK 为 hash 路由，不受影响。
    location ~* ^/(?:.+/)?(assets/.+)$ {
        try_files /$1 =404;
    }

    # Vue history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 20m;
}
