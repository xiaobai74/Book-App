<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>书架搜索 · 小说管理App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topnav" data-od-id="topnav">
  <div class="container topnav-inner">
    <a class="logo" href="shelf.html">
      <svg style="width:20px;height:20px;vertical-align:-3px;margin-right:6px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      我的书架
    </a>
    <form class="search-box" onsubmit="doSearch(event)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="search" id="global-search-input" placeholder="在书架中按书名搜索…" />
    </form>
    <div class="nav-right">
      <a class="btn btn-ghost btn-sm" href="settings.html">设置</a>
      <span class="user-avatar" id="user-avatar-display">U</span>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">退出</button>
    </div>
  </div>
</header>

<section class="section" data-od-id="search">
  <div class="container">
    <div class="row-between" style="margin-bottom:24px">
      <h2 id="search-result-title">书架搜索</h2>
      <form class="search-box" style="flex:0 1 360px" onsubmit="doSearch(event)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="search" id="search-input" placeholder="在书架中按书名搜索…" />
      </form>
    </div>

    <div class="empty-state" id="search-init">
      <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg></div>
      <p>在书架中按书名模糊搜索</p>
      <p class="meta" style="font-size:12px;margin-top:6px">v1.0 暂为书架内搜索，全文网络搜索将在后续版本接入</p>
    </div>
    <div class="empty-state" id="search-loading" style="display:none"><p>正在搜索中…</p><div class="loading-bar"></div></div>
    <div class="empty-state" id="search-empty" style="display:none"><p>未找到相关小说，请尝试其他关键词</p></div>
    <div class="empty-state" id="search-error" style="display:none"><p>搜索失败，请稍后重试</p></div>
    <div class="grid-3" id="search-results" style="display:none"></div>
    <div class="pagination" id="search-pagination" style="display:none"></div>
    <div style="text-align:center;margin-top:40px"><a class="btn btn-secondary" href="shelf.html">← 返回书架</a></div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script>
var user = requireAuthOrDemo();
initAvatar(user);

var params = new URLSearchParams(window.location.search);
var initQ = params.get('q') || '';
if (initQ) { document.getElementById('search-input').value = initQ; doSearch(); }

function doSearch(e) {
  if (e) e.preventDefault();
  var q = document.getElementById('search-input').value.trim();
  if (!q) return;

  document.getElementById('search-init').style.display = 'none';
  document.getElementById('search-empty').style.display = 'none';
  document.getElementById('search-error').style.display = 'none';
  document.getElementById('search-results').style.display = 'none';
  document.getElementById('search-pagination').style.display = 'none';
  document.getElementById('search-loading').style.display = '';

  document.getElementById('search-result-title').textContent = '搜索："' + q + '"';

  setTimeout(function() {
    document.getElementById('search-loading').style.display = 'none';
    var shelf = getShelf();
    var ql = q.toLowerCase();
    var results = shelf.filter(function(b) { return b.title.toLowerCase().indexOf(ql) !== -1 || b.author.toLowerCase().indexOf(ql) !== -1; });
    if (results.length === 0) { document.getElementById('search-empty').style.display = ''; return; }

    document.getElementById('search-results').innerHTML = results.map(function(r) {
      var cc = coverClass(r.title);
      return '<div class="search-card"><div class="row" style="align-items:flex-start;gap:16px">'
        + '<a class="book-cover-sm ' + cc + '" href="detail.html?id=' + encodeURIComponent(r.id) + '" style="flex-shrink:0"><span class="cover-spine"></span><span class="cover-title">' + escHtml(r.title.length > 4 ? r.title.slice(0,4) : r.title) + '</span></a>'
        + '<div style="flex:1"><div class="search-title">' + escHtml(r.title) + '</div>'
        + '<div class="search-author">' + escHtml(r.author) + ' · ' + (r.chapterCount || 0) + ' 章</div>'
        + '<div style="font-size:12px;color:var(--muted);margin-top:4px">' + statusBadge(r.status) + '</div>'
        + '<div class="search-actions"><a class="btn btn-sm btn-primary" href="detail.html?id=' + encodeURIComponent(r.id) + '">查看详情</a></div></div></div></div>';
    }).join('');
    document.getElementById('search-results').style.display = '';
    document.getElementById('search-pagination').style.display = '';
    document.getElementById('search-pagination').innerHTML = '<button class="page-btn active">1</button><span class="page-info">共 ' + results.length + ' 条</span>';
  }, 300);
}
</script>
</body>
</html>
