<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的书架 · 小说管理App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topnav" data-od-id="topnav">
  <div class="container topnav-inner">
    <a class="logo" href="shelf.html">
      <svg style="width:20px;height:20px;vertical-align:-3px;margin-right:6px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      我的书架
    </a>
    <form class="search-box" onsubmit="doSearch(event)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="search" id="global-search-input" placeholder="在书架中按书名搜索…" />
    </form>
    <div class="nav-right">
      <a class="btn btn-ghost btn-sm" href="settings.html">设置</a>
      <span class="user-avatar" id="user-avatar-display">U</span>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">退出</button>
    </div>
  </div>
</header>

<section class="section" data-od-id="shelf">
  <div class="container">
    <div class="row-between" style="margin-bottom:24px">
      <div>
        <h2>我的书架</h2>
        <p class="lead" style="margin-top:4px">共 <span id="shelf-count" class="num">0</span> 本小说</p>
      </div>
      <button class="btn btn-primary" onclick="showAddBookDialog()">+ 添加小说</button>
    </div>

    <div class="empty-state" id="shelf-empty">
      <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg></div>
      <p>书架空空如也，去搜索一本小说吧～</p>
      <button class="btn btn-primary" style="margin-top:16px" onclick="window.location.href='search.html'">去搜索</button>
    </div>

    <div class="stack" id="shelf-list" style="display:none;gap:12px"></div>
  </div>
</section>

<footer class="pagefoot"><div class="container">© 小说管理App · 个人学习用途</div></footer>

<div class="overlay" id="add-book-dialog" style="display:none" data-od-id="add-book-dialog">
  <div class="dialog">
    <h3>添加小说</h3>
    <form onsubmit="doAddBook(event)" style="display:flex;flex-direction:column;gap:16px">
      <div class="field"><label for="add-title">书名</label><input class="input" id="add-title" placeholder="请输入书名" required /></div>
      <div class="field"><label for="add-author">作者</label><input class="input" id="add-author" placeholder="请输入作者" required /></div>
      <div class="field"><label for="add-source-url">源站链接（选填）</label><input class="input" id="add-source-url" placeholder="https://… 小说来源网址" /></div>
      <div class="dialog-actions">
        <button class="btn btn-secondary" type="button" onclick="document.getElementById('add-book-dialog').style.display='none'">取消</button>
        <button class="btn btn-primary" type="submit">添加到书架</button>
      </div>
    </form>
  </div>
</div>

<div class="overlay" id="delete-dialog" style="display:none" data-od-id="delete-dialog">
  <div class="dialog">
    <h3>确认删除</h3>
    <p id="delete-message">确定要删除《》吗？</p>
    <div class="dialog-actions">
      <button class="btn btn-secondary" onclick="document.getElementById('delete-dialog').style.display='none'">取消</button>
      <button class="btn btn-danger" id="delete-confirm-btn">删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script>
var user = requireAuthOrDemo();
initAvatar(user);

var shelf = getShelf();
var _deleteTarget = null;

renderShelf();

function renderShelf() {
  shelf = getShelf();
  var countEl = document.getElementById('shelf-count');
  var emptyEl = document.getElementById('shelf-empty');
  var listEl = document.getElementById('shelf-list');
  countEl.textContent = shelf.length;
  if (shelf.length === 0) { emptyEl.style.display = ''; listEl.style.display = 'none'; return; }
  emptyEl.style.display = 'none'; listEl.style.display = '';
  listEl.innerHTML = shelf.map(function(book) {
    var dateStr = formatDate(book.addedAt);
    var hasEpub = book.status === 'done' ? ' · <span style="color:var(--accent-ice)">.epub 可下载</span>' : '';
    var cc = coverClass(book.title);
    return '<div class="book-card"><div class="row-between">'
      + '<div class="row" style="align-items:flex-start;gap:16px">'
      + '<a class="book-cover ' + cc + '" href="detail.html?id=' + encodeURIComponent(book.id) + '"><span class="cover-spine"></span><span class="cover-title">' + escHtml(book.title) + '</span><span class="cover-author">' + escHtml(book.author) + '</span></a>'
      + '<div><a class="book-title" href="detail.html?id=' + encodeURIComponent(book.id) + '">' + escHtml(book.title) + '</a><div class="book-author">' + escHtml(book.author) + '</div></div></div>'
      + '<button class="btn btn-icon" title="删除" onclick="showDeleteDialog(\'' + book.id + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:16px;height:16px"><path d="M4 7h16M10 7V5a1 1 0 011-1h2a1 1 0 011 1v2M6 7v12a1 1 0 001 1h10a1 1 0 001-1V7"/></svg></button>'
      + '</div><div class="book-meta-row"><span class="meta">' + dateStr + '</span>' + statusBadge(book.status) + '<span class="meta">' + (book.chapterCount || 0) + ' 章</span><span class="meta">' + hasEpub + '</span></div></div>';
  }).join('');
}

function showAddBookDialog() {
  document.getElementById('add-title').value = '';
  document.getElementById('add-author').value = '';
  document.getElementById('add-source-url').value = '';
  document.getElementById('add-book-dialog').style.display = '';
  document.getElementById('add-title').focus();
}
function doAddBook(e) {
  e.preventDefault();
  var title = document.getElementById('add-title').value.trim();
  var author = document.getElementById('add-author').value.trim() || '未知';
  var sourceUrl = document.getElementById('add-source-url').value.trim() || null;
  if (!title) return;
  shelf = getShelf();
  shelf.unshift({ id: genId(), title: title, author: author, sourceUrl: sourceUrl, status: 'idle', chapterCount: 0, addedAt: Date.now(), chapters: [] });
  saveShelf(shelf);
  document.getElementById('add-book-dialog').style.display = 'none';
  renderShelf();
  showToast('《' + title + '》已添加到书架');
}

function showDeleteDialog(bookId) {
  var book = getShelf().find(function(b) { return b.id === bookId; });
  if (!book) return;
  _deleteTarget = bookId;
  document.getElementById('delete-message').textContent = '确定要删除《' + book.title + '》吗？';
  document.getElementById('delete-dialog').style.display = '';
}
document.getElementById('delete-confirm-btn').addEventListener('click', function() {
  if (!_deleteTarget) return;
  shelf = getShelf().filter(function(b) { return b.id !== _deleteTarget; });
  saveShelf(shelf);
  _deleteTarget = null;
  document.getElementById('delete-dialog').style.display = 'none';
  renderShelf();
  showToast('小说已删除');
});

function doSearch(e) {
  e.preventDefault();
  var q = document.getElementById('global-search-input').value.trim();
  if (!q) return; window.location.href = 'search.html?q=' + encodeURIComponent(q);
}
</script>
</body>
</html>
