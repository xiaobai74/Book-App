<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人设置 · 小说管理App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topnav" data-od-id="topnav">
  <div class="container topnav-inner">
    <a class="logo" href="shelf.html">
      <svg style="width:20px;height:20px;vertical-align:-3px;margin-right:6px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      我的书架
    </a>
    <form class="search-box" onsubmit="var q=document.getElementById('global-search-input').value.trim();if(q)window.location.href='search.html?q='+encodeURIComponent(q);return false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="search" id="global-search-input" placeholder="在书架中按书名搜索…" />
    </form>
    <div class="nav-right">
      <span class="btn btn-primary btn-sm" style="font-size:12px;padding:5px 12px">设置</span>
      <span class="user-avatar" id="user-avatar-display">U</span>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">退出</button>
    </div>
  </div>
</header>

<section class="section" data-od-id="settings">
  <div class="container" style="max-width:560px">
    <a class="btn btn-ghost btn-sm" href="shelf.html" style="margin-bottom:16px">← 返回书架</a>
    <h1 style="margin-bottom:24px">个人设置</h1>

    <div class="card stack" style="gap:24px">
      <div>
        <h3>账号信息</h3>
        <p class="meta" style="margin-top:4px">当前登录：<span id="settings-email">—</span></p>
      </div>
      <hr class="rule" />
      <form id="pwd-form" style="display:flex;flex-direction:column;gap:18px">
        <h3>修改密码</h3>
        <div class="field">
          <label for="old-password">当前密码</label>
          <input class="input" id="old-password" type="password" placeholder="请输入当前密码" required />
        </div>
        <div class="field">
          <label for="new-password">新密码</label>
          <input class="input" id="new-password" type="password" placeholder="8-64位，需包含字母和数字" required minlength="8" />
        </div>
        <div class="field">
          <label for="confirm-new-password">确认新密码</label>
          <input class="input" id="confirm-new-password" type="password" placeholder="请再次输入新密码" required />
        </div>
        <p class="field-error" id="pwd-error" style="display:none"></p>
        <p class="field-help" id="pwd-success" style="display:none;color:var(--success)">密码修改成功！</p>
        <button class="btn btn-primary" type="submit" style="align-self:flex-start">修改密码</button>
      </form>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script>
var user = requireAuthOrDemo();
initAvatar(user);
document.getElementById('settings-email').textContent = user.email || '—';

document.getElementById('pwd-form').addEventListener('submit', function(e) {
  e.preventDefault();
  var newPwd = document.getElementById('new-password').value;
  var confirmPwd = document.getElementById('confirm-new-password').value;
  var errEl = document.getElementById('pwd-error');
  var okEl = document.getElementById('pwd-success');
  errEl.style.display = 'none'; okEl.style.display = 'none';

  if (newPwd.length < 8 || newPwd.length > 64) { errEl.textContent = '密码长度需为 8-64 位'; errEl.style.display = ''; return; }
  if (!/[a-zA-Z]/.test(newPwd) || !/[0-9]/.test(newPwd)) { errEl.textContent = '密码需包含字母和数字'; errEl.style.display = ''; return; }
  if (newPwd !== confirmPwd) { errEl.textContent = '两次输入的密码不一致'; errEl.style.display = ''; return; }

  okEl.style.display = '';
  document.getElementById('old-password').value = '';
  document.getElementById('new-password').value = '';
  document.getElementById('confirm-new-password').value = '';
  showToast('密码修改成功！');
});
</script>
</body>
</html>
